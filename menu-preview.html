
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grulla High School | Today's Lunch Menu</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #071b35;
  color: white;
}

.screen {
  min-height: 100vh;
  padding: 2.5vw 3.5vw;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(
      ellipse at 5% 85%,
      rgba(255, 187, 52, 0.20),
      transparent 35%
    ),
    radial-gradient(
      ellipse at 95% 10%,
      rgba(37, 107, 154, 0.45),
      transparent 40%
    ),
    linear-gradient(135deg, #06182f, #10365e);
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 2vw;
}

.brand {
  color: #ffcc54;
  font-weight: 800;
  letter-spacing: 2px;
  font-size: clamp(12px, 1.2vw, 24px);
}

h1 {
  font-size: clamp(30px, 4.2vw, 85px);
  margin: 8px 0;
  line-height: 1;
  text-transform: uppercase;
}

.date {
  font-size: clamp(14px, 1.6vw, 30px);
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.2);
  padding: 16px 24px;
  border-radius: 16px;
  text-align: center;
}

.title {
  background: linear-gradient(90deg, #d99c24, #ffdc72);
  color: #071b35;
  border-radius: 16px;
  padding: 1.3vw 2vw;
  text-align: center;
  font-size: clamp(30px, 4.2vw, 85px);
  font-weight: 900;
  letter-spacing: 2px;
  margin-bottom: 2vw;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

.menu-board {
  flex: 1;
  display: grid;
  grid-template-columns: 38% 62%;
  gap: 1.5vw;
  min-height: 0;
}

.feature-panel {
  border-radius: 22px;
  padding: 2vw;
  background:
    linear-gradient(
      rgba(5, 24, 49, 0.48),
      rgba(5, 24, 49, 0.90)
    ),
    radial-gradient(
      circle at 40% 30%,
      #448b58,
      #173f3d 50%,
      #0c2846
    );
  border: 2px solid #d9a739;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.food-icons {
  font-size: clamp(65px, 9vw, 175px);
  margin-bottom: 1.5vw;
  line-height: 1.1;
}

.feature-label {
  color: #ffce5b;
  font-size: clamp(18px, 2vw, 38px);
  font-weight: 900;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 1vw;
}

.feature-name {
  font-size: clamp(32px, 3.5vw, 70px);
  font-weight: 900;
  line-height: 1.1;
  overflow-wrap: anywhere;
}

.selection-panel {
  background: #fffdf7;
  border: 3px solid #e5b544;
  color: #102b4b;
  border-radius: 22px;
  padding: 2vw 2.5vw;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.selection-heading {
  font-size: clamp(24px, 2.6vw, 52px);
  font-weight: 900;
  color: #0c3057;
  border-bottom: 5px solid #e5b544;
  padding-bottom: 0.6vw;
  margin-bottom: 1.5vw;
}

.menu-items {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.2vw 2vw;
}

.menu-item {
  font-size: clamp(18px, 1.8vw, 37px);
  font-weight: 700;
  line-height: 1.25;
  padding: 0.7vw 0.9vw;
  border-radius: 12px;
  background: #f1f5f9;
  border-left: 6px solid #e5b544;
  overflow-wrap: anywhere;
}

.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  padding-top: 1.5vw;
  color: #ffdb83;
  font-weight: bold;
  font-size: clamp(13px, 1.2vw, 24px);
}

.status {
  font-size: clamp(18px, 2vw, 38px);
  text-align: center;
  color: #64748b;
  padding: 2vw;
}

@media (max-width: 800px) {
  .header {
    flex-direction: column;
    text-align: center;
  }

  .menu-board {
    grid-template-columns: 1fr;
  }

  .menu-items {
    grid-template-columns: 1fr;
  }

  .footer {
    flex-direction: column;
    text-align: center;
  }
}
</style>
</head>

<body>
<div class="screen">

  <header class="header">
    <div>
      <div class="brand">
        RGCGISD CHILD NUTRITION PROGRAM
      </div>
      <h1 id="campus">GRULLA HIGH SCHOOL</h1>
    </div>

    <div class="date" id="menuDate">
      Loading date...
    </div>
  </header>

  <div class="title">
    TODAY'S LUNCH MENU
  </div>

  <main class="menu-board">

    
<section class="feature-panel">
  <div class="feature-label">Today's Featured Entrée</div>
  <div class="feature-name" id="featured">
    Loading...
  </div>
</section>


    <section class="selection-panel">
      <div class="selection-heading">
        TODAY'S SELECTIONS
      </div>

      <div class="menu-items" id="menuItems">
        <div class="status">Loading lunch menu...</div>
      </div>
    </section>

  </main>

  <footer class="footer">
    <span>FUELING FUTURES</span>
    <span>Menu subject to change</span>
    <span>This institution is an equal opportunity provider.</span>
  </footer>

</div>

<script>
const MENU_URL = './grulla-lunch-menu.json';

function localToday() {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/Chicago',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit'
  }).formatToParts(new Date());

  const get = type =>
    parts.find(p => p.type === type).value;

  return get('year') + '-' +
    get('month') + '-' +
    get('day');
}

function showMessage(message) {
  document.getElementById('featured').textContent =
    'Lunch Menu';

  const container = document.getElementById('menuItems');
  container.replaceChildren();

  const item = document.createElement('div');
  item.className = 'status';
  item.textContent = message;
  container.appendChild(item);
}


async function loadLunchMenu() {
  try {
    const response = await fetch(
      MENU_URL + '?t=' + Date.now(),
      { cache: 'no-store' }
    );

    if (!response.ok) {
      throw new Error('Menu file unavailable');
    }

    const menu = await response.json();

    document.getElementById('campus').textContent =
      menu.campus || 'GRULLA HIGH SCHOOL';

    document.getElementById('menuDate').textContent =
      menu.displayDate || '';

    if (menu.date !== localToday()) {
      showMessage("Today's menu has not been published yet.");
      return;
    }

    if (
      menu.status !== 'AVAILABLE' ||
      !Array.isArray(menu.lunchItems) ||
      menu.lunchItems.length === 0
    ) {
      showMessage(
        menu.status === 'NO_CLASS'
          ? 'No Classes Today'
          : 'No lunch menu available today.'
      );
      return;
    }

    const items = menu.lunchItems.filter(Boolean);

    const entree = menu.featuredEntree ||
      items.find(item =>
        /pizza|wings|chicken|burger|taco|tamale|pasta|beef|fish|sandwich/i
          .test(item)
      ) || items[0];

    document.getElementById('featured').textContent =
      entree;

    const container =
      document.getElementById('menuItems');

    container.replaceChildren();

    items.filter(item => item !== entree)
      .forEach(function(item) {
        const element = document.createElement('div');
        element.className = 'menu-item';
        element.textContent = item;
        container.appendChild(element);
      });

    // Display a matching food photo when a
    // published image URL is available.
    // Otherwise, show the official CNP logo.
    const photoUrl =
      menu.featuredPhoto?.url ||
      menu.fallbackImage ||
      './food-images/cnp-logo.png';

    let photo = document.getElementById('foodPhoto');

    if (!photo) {
      photo = document.createElement('img');
      photo.id = 'foodPhoto';
      photo.alt = 'Featured lunch image';
      photo.style.width = '300px';
photo.style.height = '260px';
photo.style.objectFit = 'contain';
photo.style.display = 'block';
photo.style.margin = '0 auto 15px';
      photo.style.borderRadius = '14px';

      const featured =
        document.getElementById('featured');

      featured.parentElement.insertBefore(
        photo,
        featured
      );
    }

    photo.onerror = function() {
      photo.onerror = null;
      photo.src = './food-images/cnp-logo.png';
    };

    photo.src = photoUrl;

  } catch (error) {
    showMessage('Unable to load today’s lunch menu.');
    console.error(error);
  }
}


loadLunchMenu();

// Refresh menu information every minute.
setInterval(loadLunchMenu, 60000);
</script>

</body>
</html>
