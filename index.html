
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>RGCGISD CNP Digital Signage</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #071b33;
      font-family: Arial, Helvetica, sans-serif;
    }

    #slide {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: none;
      background: #071b33;
    }

    #standby {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      color: white;
      background:
        linear-gradient(135deg, #071b33, #164b7e);
    }

    #standby h1 {
      font-size: clamp(28px, 5vw, 65px);
      margin-bottom: 15px;
    }

    #standby h2 {
      font-size: clamp(20px, 3vw, 36px);
      font-weight: normal;
    }

    #standby p {
      font-size: 20px;
      color: #d7e6f5;
    }
  </style>
</head>

<body>

  <img id="slide" alt="CNP Digital Signage">

  <div id="standby">
    <h1>RGCGISD</h1>
    <h2>Child Nutrition Program</h2>
    <p>Fueling Futures</p>
    <p id="status">Loading campus announcements...</p>
  </div>

  <script>
    const CAMPUS = "CNP Office Staff";

    const CONFIG_URL = "./signage-config.json";

    const REFRESH_MS = 60000;

    const slideElement = document.getElementById("slide");
    const standbyElement = document.getElementById("standby");
    const statusElement = document.getElementById("status");

    let slides = [];
    let currentIndex = 0;
    let slideTimer = null;
    let playlistSignature = "";

    function showStandby(message) {
      clearTimeout(slideTimer);
      slideElement.style.display = "none";
      standbyElement.style.display = "flex";
      statusElement.textContent = message;
    }

    function showNextSlide() {
      clearTimeout(slideTimer);

      if (slides.length === 0) {
        showStandby("No announcements scheduled.");
        return;
      }

      if (currentIndex >= slides.length) {
        currentIndex = 0;
      }

      const slide = slides[currentIndex];

      slideElement.src = slide.url;
      slideElement.style.display = "block";
      standbyElement.style.display = "none";

      currentIndex = (currentIndex + 1) % slides.length;

      slideTimer = setTimeout(
        showNextSlide,
        slide.duration * 1000
      );
    }

    async function loadPlaylist() {
      try {
        const response = await fetch(
          CONFIG_URL + "?t=" + Date.now(),
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error("Configuration unavailable");
        }

        const config = await response.json();

        const campusData = config.campuses?.[CAMPUS];

        const newSlides = (campusData?.slides || [])
          .filter(item =>
            typeof item.url === "string" &&
            item.url.startsWith(
              "https://riocafe956-png.github.io/cnp-digital-signage/signage-images/"
            ) &&
            Number.isFinite(Number(item.duration)) &&
            Number(item.duration) >= 5 &&
            Number(item.duration) <= 120
          )
          .map(item => ({
            url: item.url,
            duration: Number(item.duration)
          }));

        const newSignature = JSON.stringify(newSlides);

        if (newSignature !== playlistSignature) {
          playlistSignature = newSignature;
          slides = newSlides;
          currentIndex = 0;
          showNextSlide();
        }

      } catch (error) {
        console.error("Playlist error:", error);

        if (slides.length === 0) {
          showStandby(
            "Waiting for campus announcements..."
          );
        }
      }
    }

    loadPlaylist();

    setInterval(loadPlaylist, REFRESH_MS);

    // Daily refresh for long-running TVs.
    setInterval(() => {
      window.location.reload();
    }, 24 * 60 * 60 * 1000);
  </script>

</body>
</html>
